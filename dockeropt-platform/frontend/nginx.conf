server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://dockeropt-backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 185s : le scan de vulnérabilités (Trivy) peut prendre plus d'une
        # minute, en particulier au premier lancement (téléchargement de sa
        # base de données). Les 60s précédentes coupaient la connexion côté
        # nginx (erreur 504) avant même que le backend ait pu répondre.
        proxy_connect_timeout 10s;
        proxy_send_timeout 185s;
        proxy_read_timeout 185s;
    }
}
