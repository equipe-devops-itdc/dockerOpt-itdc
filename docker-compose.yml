version: '3.8'

networks:
  dockeropt-network:
    name: ${DOCKEROPT_NETWORK_NAME}
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKEROPT_NETWORK_SUBNET}

volumes:
  postgres-data:
    name: ${POSTGRES_DATA_VOLUME}
  prometheus-data:
    name: ${PROMETHEUS_DATA_VOLUME}

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: ${POSTGRES_CONTAINER_NAME}
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dockeropt-network

  api-gateway:
    build:
      context: ${API_GATEWAY_IMAGE}
    container_name: ${API_GATEWAY_CONTAINER_NAME}
    restart: always
    ports:
      - "${API_GATEWAY_PORT}:5001"
    environment:
      USER_SERVICE_URL: ${API_GATEWAY_USER_SERVICE_URL}
      PRODUCT_SERVICE_URL: ${API_GATEWAY_PRODUCT_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${API_GATEWAY_NOTIFICATION_SERVICE_URL}
    deploy:
      resources:
        limits:
          cpus: '${API_GATEWAY_CPUS}'
          memory: ${API_GATEWAY_MEM_LIMIT}
    networks:
      - dockeropt-network

  user-service:
    build:
      context: ${USER_SERVICE_IMAGE}
    container_name: ${USER_SERVICE_CONTAINER_NAME}
    restart: always
    ports:
      - "${USER_SERVICE_PORT}:5002"
    deploy:
      resources:
        limits:
          cpus: '${USER_SERVICE_CPUS}'
          memory: ${USER_SERVICE_MEM_LIMIT}
    networks:
      - dockeropt-network

  product-service:
    build:
      context: ${PRODUCT_SERVICE_IMAGE}
    container_name: ${PRODUCT_SERVICE_CONTAINER_NAME}
    restart: always
    ports:
      - "${PRODUCT_SERVICE_PORT}:5003"
    deploy:
      resources:
        limits:
          cpus: '${PRODUCT_SERVICE_CPUS}'
          memory: ${PRODUCT_SERVICE_MEM_LIMIT}
    networks:
      - dockeropt-network

  notification-service:
    build:
      context: ${NOTIFICATION_SERVICE_IMAGE}
    container_name: ${NOTIFICATION_SERVICE_CONTAINER_NAME}
    restart: always
    ports:
      - "${NOTIFICATION_SERVICE_PORT}:5004"
    deploy:
      resources:
        limits:
          cpus: '${NOTIFICATION_SERVICE_CPUS}'
          memory: ${NOTIFICATION_SERVICE_MEM_LIMIT}
    networks:
      - dockeropt-network

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE}
    container_name: ${NODE_EXPORTER_CONTAINER_NAME}
    restart: always
    ports:
      - "${NODE_EXPORTER_PORT}:9100"
    networks:
      - dockeropt-network

  cadvisor:
    image: ${CADVISOR_IMAGE}
    container_name: ${CADVISOR_CONTAINER_NAME}
    restart: always
    ports:
      - "${CADVISOR_HOST_PORT}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - dockeropt-network

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    container_name: ${PROMETHEUS_CONTAINER_NAME}
    restart: always
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION}'
    networks:
      - dockeropt-network

  backend:
    build:
      context: ${DOCKEROPT_BACKEND_BUILD}
    image: ${DOCKEROPT_BACKEND_IMAGE}
    container_name: ${DOCKEROPT_BACKEND_CONTAINER_NAME}
    restart: always
    ports:
      - "${BACKEND_HOST_PORT}:5000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_MAX: ${DB_POOL_MAX}
      PROMETHEUS_URL: ${PROMETHEUS_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - dockeropt-network

  frontend:
    build:
      context: ${DOCKEROPT_FRONTEND_BUILD}
    image: ${DOCKEROPT_FRONTEND_IMAGE}
    container_name: ${DOCKEROPT_FRONTEND_CONTAINER_NAME}
    restart: always
    ports:
      - "${FRONTEND_HOST_PORT}:80"
    environment:
      REACT_APP_API_URL: ${DOCKEROPT_FRONTEND_API_URL}
    networks:
      - dockeropt-network