networks:
  dockeropt-network:
    name: ${DOCKEROPT_NETWORK_NAME}
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKEROPT_NETWORK_SUBNET}

volumes:
  prometheus-data:
    name: ${PROMETHEUS_DATA_VOLUME}

services:
  # --- PHASE 1 : APPLICATION FRONTEND ---
  frontend:
    build:
      context: ${DOCKEROPT_FRONTEND_BUILD}
      dockerfile: Dockerfile
    image: ${DOCKEROPT_FRONTEND_IMAGE}
    container_name: ${DOCKEROPT_FRONTEND_CONTAINER_NAME}
    restart: always
    ports:
      - "${FRONTEND_HOST_PORT}:80"
    environment:
      REACT_APP_API_URL: ${DOCKEROPT_FRONTEND_API_URL}
    depends_on:
      backend:
        condition: service_started
    networks:
      - dockeropt-network

  # --- PHASE 2 : APPLICATION BACKEND ---
  backend:
    build:
      context: ${DOCKEROPT_BACKEND_BUILD}
      dockerfile: Dockerfile
    image: ${DOCKEROPT_BACKEND_IMAGE}
    container_name: ${DOCKEROPT_BACKEND_CONTAINER_NAME}
    restart: always
    ports:
      - "${BACKEND_HOST_PORT}:${BACKEND_HOST_PORT}"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_MAX: ${DB_POOL_MAX}
      PROMETHEUS_URL: ${PROMETHEUS_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:5000/api/health\", (r) => process.exit(r.statusCode === 200 ? 0 : 1))' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      dockeropt-network:
        aliases:
          - backend # Fixe la résolution de nom pour le Nginx du Frontend

  # --- PHASE 3 : MICROSERVICES & API GATEWAY ---
  api-gateway:
    image: ${API_GATEWAY_IMAGE}
    container_name: ${API_GATEWAY_CONTAINER_NAME}
    restart: always
    command: tail -f /dev/null
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    environment:
      USER_SERVICE_URL: ${API_GATEWAY_USER_SERVICE_URL}
      PRODUCT_SERVICE_URL: ${API_GATEWAY_PRODUCT_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${API_GATEWAY_NOTIFICATION_SERVICE_URL}
    deploy:
      resources:
        limits:
          cpus: '${API_GATEWAY_CPUS}'
          memory: ${API_GATEWAY_MEM_LIMIT}
    networks:
      - dockeropt-network

  user-service:
    image: ${USER_SERVICE_IMAGE}
    container_name: ${USER_SERVICE_CONTAINER_NAME}
    restart: always
    command: tail -f /dev/null
    ports:
      - "${USER_SERVICE_PORT}:${USER_SERVICE_PORT}"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '${USER_SERVICE_CPUS}'
          memory: ${USER_SERVICE_MEM_LIMIT}
    networks:
      - dockeropt-network

  product-service:
    image: ${PRODUCT_SERVICE_IMAGE}
    container_name: ${PRODUCT_SERVICE_CONTAINER_NAME}
    restart: always
    command: tail -f /dev/null
    ports:
      - "${PRODUCT_SERVICE_PORT}:${PRODUCT_SERVICE_PORT}"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '${PRODUCT_SERVICE_CPUS}'
          memory: ${PRODUCT_SERVICE_MEM_LIMIT}
    networks:
      - dockeropt-network

  notification-service:
    image: ${NOTIFICATION_SERVICE_IMAGE}
    container_name: ${NOTIFICATION_SERVICE_CONTAINER_NAME}
    restart: always
    command: tail -f /dev/null
    ports:
      - "${NOTIFICATION_SERVICE_PORT}:${NOTIFICATION_SERVICE_PORT}"
    deploy:
      resources:
        limits:
          cpus: '${NOTIFICATION_SERVICE_CPUS}'
          memory: ${NOTIFICATION_SERVICE_MEM_LIMIT}
    networks:
      - dockeropt-network

  # --- PHASE 4 : MONITORING ---
  cadvisor:
    image: ${CADVISOR_IMAGE}
    container_name: ${CADVISOR_CONTAINER_NAME}
    restart: always
    ports:
      - "${CADVISOR_HOST_PORT}:${CADVISOR_HOST_PORT}"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - dockeropt-network

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    container_name: ${PROMETHEUS_CONTAINER_NAME}
    restart: always
    ports:
      - "${PROMETHEUS_PORT}:${PROMETHEUS_PORT}"
    volumes:
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION}'
    networks:
      - dockeropt-network

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE}
    container_name: ${NODE_EXPORTER_CONTAINER_NAME}
    restart: always
    ports:
      - "${NODE_EXPORTER_PORT}:${NODE_EXPORTER_PORT}"
    networks:
      - dockeropt-network