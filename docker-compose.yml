version: '3.8'

networks:
  dockeropt-network:
    name: ${DOCKEROPT_NETWORK_NAME:-dockeropt-network}
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKEROPT_NETWORK_SUBNET:-172.20.0.0/16}

volumes:
  postgres-data:
    name: ${POSTGRES_DATA_VOLUME:-dockeropt-postgres-data}
  prometheus-data:
    name: ${PROMETHEUS_DATA_VOLUME:-prometheus-data}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: ${POSTGRES_CONTAINER_NAME:-dockeropt-postgres}
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-dockeropt}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dockeropt_pass}
      POSTGRES_DB: ${DB_NAME:-dockeropt}
    ports:
      - "${POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dockeropt-network

  api-gateway:
    build:
      context: ${API_GATEWAY_IMAGE:-./services/api-gateway}
    container_name: ${API_GATEWAY_CONTAINER_NAME:-dockeropt-api-gateway}
    restart: always
    ports:
      - "${API_GATEWAY_PORT:-5001}:5001"
    environment:
      USER_SERVICE_URL: ${API_GATEWAY_USER_SERVICE_URL:-http://user-service:5002}
      PRODUCT_SERVICE_URL: ${API_GATEWAY_PRODUCT_SERVICE_URL:-http://product-service:5003}
      NOTIFICATION_SERVICE_URL: ${API_GATEWAY_NOTIFICATION_SERVICE_URL:-http://notification-service:5004}
    deploy:
      resources:
        limits:
          cpus: '${API_GATEWAY_CPUS:-0.5}'
          memory: ${API_GATEWAY_MEM_LIMIT:-256m}
    networks:
      - dockeropt-network

  user-service:
    build:
      context: ${USER_SERVICE_IMAGE:-./services/user-service}
    container_name: ${USER_SERVICE_CONTAINER_NAME:-dockeropt-user-service}
    restart: always
    ports:
      - "${USER_SERVICE_PORT:-5002}:5002"
    deploy:
      resources:
        limits:
          cpus: '${USER_SERVICE_CPUS:-0.5}'
          memory: ${USER_SERVICE_MEM_LIMIT:-256m}
    networks:
      - dockeropt-network

  product-service:
    build:
      context: ${PRODUCT_SERVICE_IMAGE:-./services/product-service}
    container_name: ${PRODUCT_SERVICE_CONTAINER_NAME:-dockeropt-product-service}
    restart: always
    ports:
      - "${PRODUCT_SERVICE_PORT:-5003}:5003"
    deploy:
      resources:
        limits:
          cpus: '${PRODUCT_SERVICE_CPUS:-0.5}'
          memory: ${PRODUCT_SERVICE_MEM_LIMIT:-256m}
    networks:
      - dockeropt-network

  notification-service:
    build:
      context: ${NOTIFICATION_SERVICE_IMAGE:-./services/notification-service}
    container_name: ${NOTIFICATION_SERVICE_CONTAINER_NAME:-dockeropt-notification-service}
    restart: always
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-5004}:5004"
    deploy:
      resources:
        limits:
          cpus: '${NOTIFICATION_SERVICE_CPUS:-0.5}'
          memory: ${NOTIFICATION_SERVICE_MEM_LIMIT:-256m}
    networks:
      - dockeropt-network

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:latest}
    container_name: ${NODE_EXPORTER_CONTAINER_NAME:-dockeropt-node-exporter}
    restart: always
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    networks:
      - dockeropt-network

  cadvisor:
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:latest}
    container_name: ${CADVISOR_CONTAINER_NAME:-dockeropt-cadvisor}
    restart: always
    ports:
      - "${CADVISOR_INTERNAL_PORT:-8080}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - dockeropt-network

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:latest}
    container_name: ${PROMETHEUS_CONTAINER_NAME:-dockeropt-prometheus}
    restart: always
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}'
    networks:
      - dockeropt-network

  backend:
    build:
      context: ${DOCKEROPT_BACKEND_BUILD:-./dockeropt-platform/backend}
    image: ${DOCKEROPT_BACKEND_IMAGE:-dockeropt-backend:latest}
    container_name: ${DOCKEROPT_BACKEND_CONTAINER_NAME:-dockeropt-backend}
    restart: always
    ports:
      - "${BACKEND_HOST_PORT:-5000}:5000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dockeropt:dockeropt_pass@postgres:5432/dockeropt}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-dockeropt}
      DB_USER: ${DB_USER:-dockeropt}
      DB_PASSWORD: ${DB_PASSWORD:-dockeropt_pass}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - dockeropt-network

  frontend:
    build:
      context: ${DOCKEROPT_FRONTEND_BUILD:-./dockeropt-platform/frontend}
    image: ${DOCKEROPT_FRONTEND_IMAGE:-dockeropt-frontend:latest}
    container_name: ${DOCKEROPT_FRONTEND_CONTAINER_NAME:-dockeropt-frontend}
    restart: always
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    environment:
      REACT_APP_API_URL: ${DOCKEROPT_FRONTEND_API_URL:-http://192.168.1.201:5000}
    networks:
      - dockeropt-network