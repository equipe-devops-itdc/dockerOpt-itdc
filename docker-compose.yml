# ==========================================================
# DOCKEROPT - DOCKER COMPOSE (PRODUCTION)
# PostgreSQL EXTERNE
# ==========================================================

networks:
  dockeropt-network:
    name: ${DOCKEROPT_NETWORK_NAME}
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKEROPT_NETWORK_SUBNET}

volumes:
  prometheus-data:
    name: ${PROMETHEUS_DATA_VOLUME}

services:

  # API GATEWAY
  api-gateway:
    build: ${API_GATEWAY_IMAGE}
    container_name: ${API_GATEWAY_CONTAINER_NAME}
    expose:
      - "${API_GATEWAY_PORT}"
    environment:
      PORT: "${API_GATEWAY_PORT}"
      USER_SERVICE_URL: "${API_GATEWAY_USER_SERVICE_URL}"
      PRODUCT_SERVICE_URL: "${API_GATEWAY_PRODUCT_SERVICE_URL}"
      NOTIFICATION_SERVICE_URL: "${API_GATEWAY_NOTIFICATION_SERVICE_URL}"
    networks:
      - dockeropt-network
    restart: always
    mem_limit: ${API_GATEWAY_MEM_LIMIT}
    cpus: "${API_GATEWAY_CPUS}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${API_GATEWAY_PORT}/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # USER SERVICE
  user-service:
    build: ${USER_SERVICE_IMAGE}
    container_name: ${USER_SERVICE_CONTAINER_NAME}
    expose:
      - "${USER_SERVICE_PORT}"
    environment:
      PORT: "${USER_SERVICE_PORT}"
    networks:
      - dockeropt-network
    restart: always
    mem_limit: ${USER_SERVICE_MEM_LIMIT}
    cpus: "${USER_SERVICE_CPUS}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${USER_SERVICE_PORT}/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # PRODUCT SERVICE
  product-service:
    build: ${PRODUCT_SERVICE_IMAGE}
    container_name: ${PRODUCT_SERVICE_CONTAINER_NAME}
    expose:
      - "${PRODUCT_SERVICE_PORT}"
    environment:
      PORT: "${PRODUCT_SERVICE_PORT}"
    networks:
      - dockeropt-network
    restart: always
    mem_limit: ${PRODUCT_SERVICE_MEM_LIMIT}
    cpus: "${PRODUCT_SERVICE_CPUS}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PRODUCT_SERVICE_PORT}/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # NOTIFICATION SERVICE
  notification-service:
    build: ${NOTIFICATION_SERVICE_IMAGE}
    container_name: ${NOTIFICATION_SERVICE_CONTAINER_NAME}
    expose:
      - "${NOTIFICATION_SERVICE_PORT}"
    environment:
      PORT: "${NOTIFICATION_SERVICE_PORT}"
    networks:
      - dockeropt-network
    restart: always
    mem_limit: ${NOTIFICATION_SERVICE_MEM_LIMIT}
    cpus: "${NOTIFICATION_SERVICE_CPUS}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${NOTIFICATION_SERVICE_PORT}/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # NODE EXPORTER
  node-exporter:
    image: ${NODE_EXPORTER_IMAGE}
    container_name: ${NODE_EXPORTER_CONTAINER_NAME}
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    expose:
      - "${NODE_EXPORTER_PORT}"
    networks:
      - dockeropt-network
    restart: always

  # CADVISOR
  cadvisor:
    image: ${CADVISOR_IMAGE}
    container_name: ${CADVISOR_CONTAINER_NAME}
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "${CADVISOR_INTERNAL_PORT}"
    networks:
      - dockeropt-network
    restart: always
    privileged: true

  # PROMETHEUS
  prometheus:
    image: ${PROMETHEUS_IMAGE}
    container_name: ${PROMETHEUS_CONTAINER_NAME}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION}"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    expose:
      - "${PROMETHEUS_PORT}"
    networks:
      - dockeropt-network
    restart: always
    depends_on:
      - cadvisor
      - node-exporter

  # DOCKEROPT BACKEND
  dockeropt-backend:
    build: ${DOCKEROPT_BACKEND_BUILD}
    image: ${DOCKEROPT_BACKEND_IMAGE}
    container_name: ${DOCKEROPT_BACKEND_CONTAINER_NAME}
    expose:
      - "${DOCKEROPT_BACKEND_INTERNAL_PORT}"
    environment:
      PORT: "${DOCKEROPT_BACKEND_INTERNAL_PORT}"
      PROMETHEUS_URL: "${PROMETHEUS_URL}"
      DOCKER_HOST: "${DOCKER_HOST}"
      DATABASE_URL: "${DATABASE_URL}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_POOL_MAX: "${DB_POOL_MAX}"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_SECURE: "${SMTP_SECURE}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      SMTP_FROM: "${SMTP_FROM}"
      ALERT_EMAIL_TO: "${ALERT_EMAIL_TO}"
      ALERT_CHECK_INTERVAL_MS: "${ALERT_CHECK_INTERVAL_MS}"
      PLATFORM_URL: "${PLATFORM_URL}"
      PLATFORM_INFRA_CONTAINERS: "${PLATFORM_INFRA_CONTAINERS}"
      RECO_WINDOW_MS: "${RECO_WINDOW_MS}"
      RECO_MIN_SAMPLES: "${RECO_MIN_SAMPLES}"
      OPTIMIZATION_COOLDOWN_MS: "${OPTIMIZATION_COOLDOWN_MS}"
      SECURITY_SCAN_TIMEOUT_MS: "${SECURITY_SCAN_TIMEOUT_MS}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - dockeropt-network
    restart: always
    depends_on:
      prometheus:
        condition: service_started

  # FRONTEND
  dockeropt-frontend:
    build: ${DOCKEROPT_FRONTEND_BUILD}
    image: ${DOCKEROPT_FRONTEND_IMAGE}
    container_name: ${DOCKEROPT_FRONTEND_CONTAINER_NAME}
    ports:
      - "${FRONTEND_HOST_PORT}:${FRONTEND_INTERNAL_PORT}"
    environment:
      API_URL: "${DOCKEROPT_FRONTEND_API_URL}"
    networks:
      - dockeropt-network
    restart: always
    depends_on:
      - dockeropt-backend