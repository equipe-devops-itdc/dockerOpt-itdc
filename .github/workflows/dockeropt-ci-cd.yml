name: DockerOpt CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/dockeropt-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/dockeropt-frontend

# ==========================================================
# 1. TEST BACKEND
# ==========================================================

jobs:

  test-backend:

    name: Test Backend
    runs-on: ubuntu-latest

    steps:

      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dockeropt-platform/backend/package-lock.json

      - name: Installation des dépendances Backend
        working-directory: dockeropt-platform/backend
        run: npm ci

      - name: Exécution des tests Backend
        working-directory: dockeropt-platform/backend
        run: npm test


# ==========================================================
# 2. TEST / BUILD FRONTEND
# ==========================================================

  test-frontend:

    name: Test et Build Frontend
    runs-on: ubuntu-latest

    steps:

      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dockeropt-platform/frontend/package-lock.json

      - name: Installation des dépendances Frontend
        working-directory: dockeropt-platform/frontend
        run: npm ci

      - name: Build Frontend
        working-directory: dockeropt-platform/frontend
        run: npm run build


# ==========================================================
# 3. BUILD IMAGE BACKEND
# ==========================================================

  build-backend:

    name: Build Docker Backend
    runs-on: ubuntu-latest

    needs:
      - test-backend

    permissions:
      contents: read
      packages: write

    steps:

      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configuration Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build et Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./dockeropt-platform/backend
          file: ./dockeropt-platform/backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest


# ==========================================================
# 4. BUILD IMAGE FRONTEND
# ==========================================================

  build-frontend:

    name: Build Docker Frontend
    runs-on: ubuntu-latest

    needs:
      - test-frontend

    permissions:
      contents: read
      packages: write

    steps:

      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configuration Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build et Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./dockeropt-platform/frontend
          file: ./dockeropt-platform/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest


# ==========================================================
# 5. SCAN TRIVY BACKEND
# ==========================================================

    scan-backend:

    name: Scan Trivy Backend

    runs-on: ubuntu-latest

    needs:
      - build-backend

    permissions:
      contents: read
      security-events: write

    steps:

      - name: Scan des vulnérabilités Backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: table
          exit-code: 0
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL


# ==========================================================
# 6. SCAN TRIVY FRONTEND
# ==========================================================

  scan-frontend:

    name: Scan Trivy Frontend
    runs-on: ubuntu-latest

    needs:
      - build-frontend

    permissions:
      contents: read
      packages: read
      security-events: write

    steps:

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Téléchargement de l'image Frontend
        run: |
          docker pull ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Scan Trivy Frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL


# ==========================================================
# 7. DEPLOIEMENT DOCKER STANDALONE
# ==========================================================

  deploy:

    name: Déploiement Docker Standalone
    runs-on: ubuntu-latest

    needs:
      - scan-backend
      - scan-frontend

    if: github.ref == 'refs/heads/main'

    steps:

      - name: Déploiement sur Docker Standalone
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.DOCKER_HOST }}
          username: ${{ secrets.DOCKER_USER }}
          key: ${{ secrets.DOCKER_SSH_KEY }}

          script: |

            set -e

            echo "======================================"
            echo " DockerOpt CI/CD"
            echo "======================================"

            cd /opt/dockeropt

            echo "Connexion à GHCR"

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              --username "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            echo "Téléchargement des nouvelles images"

            docker compose pull \
              dockeropt-backend \
              dockeropt-frontend

            echo "Redémarrage des services"

            docker compose up -d \
              dockeropt-backend \
              dockeropt-frontend

            echo "Attente du démarrage"

            sleep 10

            echo "État des conteneurs"

            docker compose ps

            echo "Nettoyage"

            docker image prune -f

            echo "======================================"
            echo " Déploiement terminé avec succès"
            echo "======================================"