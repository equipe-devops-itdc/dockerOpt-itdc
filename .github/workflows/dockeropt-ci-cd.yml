name: DockerOpt CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# ==========================================================
# PERMISSIONS GLOBALES
# ==========================================================
permissions:
  contents: read

# ==========================================================
# VARIABLES
# ==========================================================
env:
  REGISTRY: ghcr.io
  
  # ⚠️ ATTENTION : Remplacez "votre_pseudo" par votre vrai nom d'utilisateur GitHub TOUT EN MINUSCULES
  BACKEND_IMAGE: ghcr.io/equipe-devops-itdc/dockeropt-backend
  
  # ⚠️ ATTENTION : Remplacez "votre_pseudo" par votre vrai nom d'utilisateur GitHub TOUT EN MINUSCULES
  FRONTEND_IMAGE: ghcr.io/equipe-devops-itdc/dockeropt-frontend


# ==========================================================
# JOBS
# ==========================================================
jobs:

  # ========================================================
  # 1. TEST BACKEND
  # ========================================================
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dockeropt-platform/backend/package-lock.json

      - name: Installation des dépendances Backend
        working-directory: dockeropt-platform/backend
        run: npm ci

      - name: Exécution des tests Backend
        working-directory: dockeropt-platform/backend
        run: npm test

  # ========================================================
  # 2. TEST ET BUILD FRONTEND
  # ========================================================
  test-frontend:
    name: Test et Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dockeropt-platform/frontend/package-lock.json

      - name: Installation des dépendances Frontend
        working-directory: dockeropt-platform/frontend
        run: npm ci

      - name: Build Frontend
        working-directory: dockeropt-platform/frontend
        run: npm run build

  # ========================================================
  # 3. BUILD DOCKER BACKEND
  # ========================================================
  build-backend:
    name: Build Docker Backend
    runs-on: ubuntu-latest
    needs:
      - test-backend
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configuration Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build et Push de l'image Backend
        uses: docker/build-push-action@v6
        with:
          context: ./dockeropt-platform/backend
          file: ./dockeropt-platform/backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

  # ========================================================
  # 4. BUILD DOCKER FRONTEND
  # ========================================================
  build-frontend:
    name: Build Docker Frontend
    runs-on: ubuntu-latest
    needs:
      - test-frontend
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configuration Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build et Push de l'image Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./dockeropt-platform/frontend
          file: ./dockeropt-platform/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

  # ========================================================
  # 5. SCAN TRIVY BACKEND
  # ========================================================
  scan-backend:
    name: Scan Trivy Backend
    runs-on: ubuntu-latest
    needs:
      - build-backend
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Vérification de l'image Backend (Pull local)
        run: docker pull ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Scan Trivy Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: table
          exit-code: 0
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  # ========================================================
  # 6. SCAN TRIVY FRONTEND
  # ========================================================
  scan-frontend:
    name: Scan Trivy Frontend
    runs-on: ubuntu-latest
    needs:
      - build-frontend
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Vérification de l'image Frontend (Pull local)
        run: docker pull ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Scan Trivy Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: table
          exit-code: 0
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

 # ========================================================
  # 7. DÉPLOIEMENT DOCKER STANDALONE
  # ========================================================
  deploy:
    name: Déploiement Local Kali Linux
    runs-on: self-hosted
    needs:
      - scan-backend
      - scan-frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Déploiement Docker Compose
        run: |
          set -e
          echo "======================================"
          echo "  Déploiement DockerOpt sur Kali"
          echo "======================================"

          cd /home/joel/Documents/devOpss/dockeropt

          # Connexion à GHCR via le PAT au lieu du GITHUB_TOKEN
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

          echo "Pull des images..."
          docker pull ${{ env.BACKEND_IMAGE }}:latest
          docker pull ${{ env.FRONTEND_IMAGE }}:latest

          echo "Démarrage des conteneurs..."
          docker compose up -d --no-build dockeropt-backend dockeropt-frontend

          docker image prune -f

          echo "======================================"
          echo " État des conteneurs :"
          docker compose ps
          echo "======================================"