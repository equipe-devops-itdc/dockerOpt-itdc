name: DockerOpt CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# ==========================================================
# PERMISSIONS GLOBALES
# ==========================================================

permissions:
  contents: read


# ==========================================================
# VARIABLES
# ==========================================================

env:
  REGISTRY: ghcr.io

  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/dockeropt-backend

  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/dockeropt-frontend


# ==========================================================
# JOBS
# ==========================================================

jobs:


  # ========================================================
  # 1. TEST BACKEND
  # ========================================================

  test-backend:

    name: Test Backend

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------
      # Récupération du projet
      # ----------------------------------------------------

      - name: Récupération du code
        uses: actions/checkout@v4


      # ----------------------------------------------------
      # Installation Node.js
      # ----------------------------------------------------

      - name: Installation Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dockeropt-platform/backend/package-lock.json


      # ----------------------------------------------------
      # Installation dépendances
      # ----------------------------------------------------

      - name: Installation des dépendances Backend
        working-directory: dockeropt-platform/backend
        run: npm ci


      # ----------------------------------------------------
      # Tests Jest
      # ----------------------------------------------------

      - name: Exécution des tests Backend
        working-directory: dockeropt-platform/backend
        run: npm test


  # ========================================================
  # 2. TEST + BUILD FRONTEND
  # ========================================================

  test-frontend:

    name: Test et Build Frontend

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------
      # Récupération du projet
      # ----------------------------------------------------

      - name: Récupération du code
        uses: actions/checkout@v4


      # ----------------------------------------------------
      # Installation Node.js
      # ----------------------------------------------------

      - name: Installation Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dockeropt-platform/frontend/package-lock.json


      # ----------------------------------------------------
      # Installation dépendances
      # ----------------------------------------------------

      - name: Installation des dépendances Frontend
        working-directory: dockeropt-platform/frontend
        run: npm ci


      # ----------------------------------------------------
      # Build Frontend
      # ----------------------------------------------------

      - name: Build Frontend
        working-directory: dockeropt-platform/frontend
        run: npm run build


  # ========================================================
  # 3. BUILD DOCKER BACKEND
  # ========================================================

  build-backend:

    name: Build Docker Backend

    runs-on: ubuntu-latest

    needs:
      - test-backend

    permissions:
      contents: read
      packages: write

    steps:

      # ----------------------------------------------------
      # Récupération du projet
      # ----------------------------------------------------

      - name: Récupération du code
        uses: actions/checkout@v4


      # ----------------------------------------------------
      # Connexion GHCR
      # ----------------------------------------------------

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ----------------------------------------------------
      # Docker Buildx
      # ----------------------------------------------------

      - name: Configuration Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ----------------------------------------------------
      # Build + Push Backend
      # ----------------------------------------------------

      - name: Build et Push de l'image Backend
        uses: docker/build-push-action@v6
        with:
          context: ./dockeropt-platform/backend
          file: ./dockeropt-platform/backend/Dockerfile
          push: true

          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest


  # ========================================================
  # 4. BUILD DOCKER FRONTEND
  # ========================================================

  build-frontend:

    name: Build Docker Frontend

    runs-on: ubuntu-latest

    needs:
      - test-frontend

    permissions:
      contents: read
      packages: write

    steps:

      # ----------------------------------------------------
      # Récupération du projet
      # ----------------------------------------------------

      - name: Récupération du code
        uses: actions/checkout@v4


      # ----------------------------------------------------
      # Connexion GHCR
      # ----------------------------------------------------

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ----------------------------------------------------
      # Docker Buildx
      # ----------------------------------------------------

      - name: Configuration Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ----------------------------------------------------
      # Build + Push Frontend
      # ----------------------------------------------------

      - name: Build et Push de l'image Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./dockeropt-platform/frontend
          file: ./dockeropt-platform/frontend/Dockerfile
          push: true

          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest


  # ========================================================
  # 5. SCAN TRIVY BACKEND
  # ========================================================

  scan-backend:

    name: Scan Trivy Backend

    runs-on: ubuntu-latest

    needs:
      - build-backend

    permissions:
      contents: read
      security-events: write

    steps:

      # ----------------------------------------------------
      # Scan Backend
      # ----------------------------------------------------

      - name: Scan des vulnérabilités Backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:

          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

          format: table

          # TEMPORAIRE :
          # permet de voir les vulnérabilités
          # sans bloquer le pipeline

          exit-code: 0

          ignore-unfixed: true

          vuln-type: os,library

          severity: HIGH,CRITICAL


      # ----------------------------------------------------
      # Rapport SARIF Backend
      # ----------------------------------------------------

      - name: Génération du rapport Trivy Backend
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:

          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

          format: sarif

          output: trivy-backend.sarif

          ignore-unfixed: true

          vuln-type: os,library

          severity: HIGH,CRITICAL


      # ----------------------------------------------------
      # Publication GitHub Security
      # ----------------------------------------------------

      - name: Publication du rapport Backend
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-backend.sarif


  # ========================================================
  # 6. SCAN TRIVY FRONTEND
  # ========================================================

  scan-frontend:

    name: Scan Trivy Frontend

    runs-on: ubuntu-latest

    needs:
      - build-frontend

    permissions:
      contents: read
      security-events: write

    steps:

      # ----------------------------------------------------
      # Scan Frontend
      # ----------------------------------------------------

      - name: Scan des vulnérabilités Frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:

          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

          format: table

          # Temporairement à 0
          # pour analyser les vulnérabilités

          exit-code: 0

          ignore-unfixed: true

          vuln-type: os,library

          severity: HIGH,CRITICAL


      # ----------------------------------------------------
      # Rapport SARIF Frontend
      # ----------------------------------------------------

      - name: Génération du rapport Trivy Frontend
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:

          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

          format: sarif

          output: trivy-frontend.sarif

          ignore-unfixed: true

          vuln-type: os,library

          severity: HIGH,CRITICAL


      # ----------------------------------------------------
      # Publication GitHub Security
      # ----------------------------------------------------

      - name: Publication du rapport Frontend
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-frontend.sarif


  # ========================================================
  # 7. DÉPLOIEMENT DOCKER STANDALONE
  # ========================================================

  deploy:

    name: Déploiement Docker Standalone

    runs-on: ubuntu-latest

    needs:
      - scan-backend
      - scan-frontend

    # Déploiement uniquement après un push sur main

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # ----------------------------------------------------
      # Connexion SSH au serveur Docker
      # ----------------------------------------------------

      - name: Connexion au serveur Docker Standalone
        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.DOCKER_HOST }}

          username: ${{ secrets.DOCKER_USER }}

          key: ${{ secrets.DOCKER_SSH_KEY }}

          script: |

            set -e

            echo "======================================"
            echo "       DockerOpt CI/CD"
            echo "======================================"

            echo "Serveur Docker connecté"

            # ------------------------------------------------
            # Répertoire du projet
            # ------------------------------------------------

            cd /opt/dockeropt

            echo "Répertoire du projet :"

            pwd


            # ------------------------------------------------
            # Connexion GHCR
            # ------------------------------------------------

            echo "Connexion à GitHub Container Registry"

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              --username "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin


            # ------------------------------------------------
            # Télécharger les nouvelles images
            # ------------------------------------------------

            echo "Téléchargement des nouvelles images..."

            docker compose pull \
              dockeropt-backend \
              dockeropt-frontend


            # ------------------------------------------------
            # Redémarrage Backend + Frontend
            # ------------------------------------------------

            echo "Redémarrage des services..."

            docker compose up -d \
              dockeropt-backend \
              dockeropt-frontend


            # ------------------------------------------------
            # Attente
            # ------------------------------------------------

            echo "Attente du démarrage des services..."

            sleep 15


            # ------------------------------------------------
            # Vérification
            # ------------------------------------------------

            echo "État des conteneurs :"

            docker compose ps


            # ------------------------------------------------
            # Vérification Backend
            # ------------------------------------------------

            echo "Vérification Backend..."

            docker inspect \
              --format='{{.State.Status}}' \
              dockeropt-backend


            # ------------------------------------------------
            # Vérification Frontend
            # ------------------------------------------------

            echo "Vérification Frontend..."

            docker inspect \
              --format='{{.State.Status}}' \
              dockeropt-frontend


            # ------------------------------------------------
            # Nettoyage
            # ------------------------------------------------

            echo "Nettoyage des anciennes images..."

            docker image prune -f


            echo "======================================"
            echo " Déploiement terminé avec succès"
            echo "======================================"