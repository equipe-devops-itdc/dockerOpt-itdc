name: DockerOpt Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dockeropt-production
  cancel-in-progress: false

jobs:

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            services/api-gateway/package-lock.json
            services/user-service/package-lock.json
            services/product-service/package-lock.json
            services/notification-service/package-lock.json
            dockeropt-platform/backend/package-lock.json
            dockeropt-platform/frontend/package-lock.json

      - name: Install API Gateway
        working-directory: services/api-gateway
        run: npm ci

      - name: Install User Service
        working-directory: services/user-service
        run: npm ci

      - name: Install Product Service
        working-directory: services/product-service
        run: npm ci

      - name: Install Notification Service
        working-directory: services/notification-service
        run: npm ci

      - name: Install Backend
        working-directory: dockeropt-platform/backend
        run: npm ci

      - name: Install Frontend
        working-directory: dockeropt-platform/frontend
        run: npm ci

      - name: Tests
        run: |
          echo "Ajouter ici les tests unitaires/intégration du projet"


  security:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true


  build:
    name: Build and Push
    runs-on: ubuntu-latest
    needs:
      - test
      - security

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/dockeropt-backend
            ghcr.io/${{ github.repository_owner }}/dockeropt-frontend
            ghcr.io/${{ github.repository_owner }}/dockeropt-api-gateway
            ghcr.io/${{ github.repository_owner }}/dockeropt-user-service
            ghcr.io/${{ github.repository_owner }}/dockeropt-product-service
            ghcr.io/${{ github.repository_owner }}/dockeropt-notification-service

      - name: Build backend
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/dockeropt-backend:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/dockeropt-backend:latest \
            ./dockeropt-platform/backend

      - name: Build frontend
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/dockeropt-frontend:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/dockeropt-frontend:latest \
            ./dockeropt-platform/frontend

      - name: Build API Gateway
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/dockeropt-api-gateway:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/dockeropt-api-gateway:latest \
            ./services/api-gateway

      - name: Build User Service
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/dockeropt-user-service:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/dockeropt-user-service:latest \
            ./services/user-service

      - name: Build Product Service
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/dockeropt-product-service:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/dockeropt-product-service:latest \
            ./services/product-service

      - name: Build Notification Service
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/dockeropt-notification-service:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/dockeropt-notification-service:latest \
            ./services/notification-service

      - name: Push images
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/dockeropt-backend:latest
          docker push ghcr.io/${{ github.repository_owner }}/dockeropt-frontend:latest
          docker push ghcr.io/${{ github.repository_owner }}/dockeropt-api-gateway:latest
          docker push ghcr.io/${{ github.repository_owner }}/dockeropt-user-service:latest
          docker push ghcr.io/${{ github.repository_owner }}/dockeropt-product-service:latest
          docker push ghcr.io/${{ github.repository_owner }}/dockeropt-notification-service:latest


  deploy:
    name: Deploy Rocky Production
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: production
      url: https://dockeropt.duckdns.org

    steps:

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}

          script: |
            set -e

            cd /opt/dockeropt

            git fetch origin main
            git reset --hard origin/main

            docker compose \
              -f docker-compose.prod.yml \
              pull

            docker compose \
              -f docker-compose.prod.yml \
              up -d \
              --remove-orphans

            docker image prune -f

            sleep 15

            docker compose \
              -f docker-compose.prod.yml \
              ps

            curl -f https://dockeropt.duckdns.org/ || exit 1